stages:
  - build
  - test
  - publish
  
default:
  image: mcr.microsoft.com/dotnet/sdk:8.0

variables:
  NUGET_API_KEY: $NUGET_API_KEY
  NUGET_API_URL: $NUGET_API_URL

build-job:
  stage: build
  script:
    - dotnet build --configuration Release
  artifacts:
    paths:
      - /*/Bin/**
  only:
    - branches 
    - tags

test-job:
  stage: test
  script:
    - dotnet test --no-build --filter FullyQualifiedName!~Rest --configuration Release --results-directory "Coverage" --collect "XPlat Code Coverage"
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: Coverage/*/coverage.cobertura.xml
  only:
    - branches 
    - tags
  dependencies:
    - build-job

publish-job:
  stage: publish
  script:
    - PACKAGE_VERSION=$(echo "$CI_COMMIT_TAG" | cut -d "v" -f2- )
    - for project in $(ls **/*.csproj | grep -v 'Test.csproj$'); do
        dotnet pack $project --configuration Release --output nupkgs /p:PackageVersion=${PACKAGE_VERSION};
      done
    - dotnet nuget push "nupkgs/*.nupkg" --source $NUGET_API_URL --api-key $NUGET_API_KEY;
  only:
    refs: 
      - tags
  dependencies:
    - build-job
    - test-job