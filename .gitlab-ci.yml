stages:
  - build
  - test
  - publish

variables:
  NUGET_API_URL: "https://api.nuget.org/v3/index.json" # Substitua pela URL da sua API NuGet se necessário
  NUGET_API_KEY: $NUGET_API_KEY # Defina esta variável no GitLab CI/CD environment variables
  PACKAGE_VERSION: $CI_COMMIT_TAG

default:
  image: mcr.microsoft.com/dotnet/sdk:8.0

before_script:
  - export PACKAGE_VERSION=${PACKAGE_VERSION#"v"} # Remove the "v" prefix

build-job:
  stage: build
  script:
    - dotnet build --configuration Release
  only:
    - tags

test-job:
  stage: test
  script:
    - dotnet dev-certs https
    - dotnet dev-certs https --trust
    - dotnet test --filter FullyQualifiedName!~Rest --logger trx --results-directory "Coverage" --configuration Release --collect "XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
  artifacts:
    paths:
      - Coverage/**/coverage.opencover.xml
  only:
    - tags
  dependencies:
    - build-job

publish-job:
  stage: publish
  script:
    - for project in $(ls **/*.csproj); do
        dotnet pack $project --configuration Release --output nupkgs /p:PackageVersion=${CI_COMMIT_TAG};
        dotnet nuget push "nupkgs/*.nupkg" --source $NUGET_API_URL --api-key $NUGET_API_KEY;
      done
  only:
    - tags
  dependencies:
    - build-job
    - test-job