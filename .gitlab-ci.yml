stages:
  - build
  - test
  - publish
  
default:
  image: mcr.microsoft.com/dotnet/sdk:8.0

variables:
  NUGET_API_KEY: $NUGET_API_KEY
  NUGET_API_URL: $NUGET_API_URL
  NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .nuget/

build-job:
  stage: build
  only:
    - branches
    - tags
  script:
    - dotnet restore Myth.slnx --verbosity minimal
    - dotnet build Myth.slnx
      --configuration Release
      --no-restore
      --verbosity minimal
  artifacts:
    expire_in: 1 hour
    paths:
      - "**/bin/**"
      - "**/obj/**"

test-job:
  stage: test
  only:
    - branches
    - tags
  script:
    - dotnet test Myth.slnx
      --configuration Release
      --no-build
      --no-restore
      --verbosity minimal
      --results-directory "Coverage"
      --collect "XPlat Code Coverage"
      --logger "trx;LogFileName=test-results.trx"
      --filter "FullyQualifiedName!~Rest"
  artifacts:
    expire_in: 1 week
    reports:
      junit: Coverage/*.trx
      coverage_report:
        coverage_format: cobertura
        path: Coverage/*/coverage.cobertura.xml
    paths:
      - Coverage/
  dependencies:
    - build-job

publish-job:
  stage: publish
  only:
    refs: 
      - tags
  dependencies:
    - build-job
    - test-job
  script:
    - PACKAGE_VERSION=$(echo "$CI_COMMIT_TAG" | cut -d "v" -f2- )
    - mkdir -p nupkgs
    - |
      # Pack all projects sequentially to ensure proper dependency resolution
      for project in $(ls **/*.csproj | grep -v '\.Test\.csproj$'); do
        echo "Packing $project..."
        dotnet pack "$project" \
          --configuration Release \
          --output nupkgs \
          --verbosity minimal \
          /p:PackageVersion=${PACKAGE_VERSION}
      done
    - dotnet nuget push "nupkgs/*.nupkg" --skip-duplicate --source $NUGET_API_URL --api-key $NUGET_API_KEY