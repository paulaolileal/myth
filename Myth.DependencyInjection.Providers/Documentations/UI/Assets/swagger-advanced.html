<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>%(DocumentTitle)</title>
	<link rel="stylesheet" type="text/css" href="./swagger-ui-bundle.css" />
	<link rel="stylesheet" type="text/css" href="./swagger-ui-standalone-preset.css" />
	<link rel="stylesheet" type="text/css" href="/swagger-ui/swagger-advanced.css" />
	<style>
		html {
			box-sizing: border-box;
			overflow: -moz-scrollbars-vertical;
			overflow-y: scroll;
		}

		*, *:before, *:after {
			box-sizing: inherit;
		}

		body {
			margin: 0;
			background: var(--swagger-bg-primary, #fafafa);
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
		}

		/* Preloader */
		.swagger-preloader {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: var(--swagger-bg-primary, #fafafa);
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 9999;
			transition: opacity 0.3s ease;
		}

			.swagger-preloader.hidden {
				opacity: 0;
				pointer-events: none;
			}

		.swagger-loader {
			width: 40px;
			height: 40px;
			border: 4px solid var(--swagger-border-color, #e0e0e0);
			border-top: 4px solid var(--swagger-accent-color, #007bff);
			border-radius: 50%;
			animation: spin 1s linear infinite;
		}

		@keyframes spin {
			0% {
				transform: rotate(0deg);
			}

			100% {
				transform: rotate(360deg);
			}
		}

		/* Enhanced layout */
		#swagger-ui {
			max-width: 1400px;
			margin: 0 auto;
			padding: 20px;
		}

		/* Error boundary */
		.swagger-error-boundary {
			background: #fee;
			border: 1px solid #fcc;
			padding: 20px;
			margin: 20px 0;
			border-radius: 8px;
			color: #c00;
		}

			.swagger-error-boundary h3 {
				margin-top: 0;
				color: #c00;
			}

			.swagger-error-boundary details {
				margin-top: 10px;
			}

			.swagger-error-boundary summary {
				cursor: pointer;
				font-weight: bold;
			}

			.swagger-error-boundary pre {
				background: #f5f5f5;
				padding: 10px;
				border-radius: 4px;
				overflow: auto;
				font-size: 12px;
			}

		/* Enhanced scrollbar for webkit browsers */
		::-webkit-scrollbar {
			width: 8px;
			height: 8px;
		}

		::-webkit-scrollbar-track {
			background: var(--swagger-bg-secondary, #f1f1f1);
		}

		::-webkit-scrollbar-thumb {
			background: var(--swagger-border-color, #c1c1c1);
			border-radius: 4px;
		}

			::-webkit-scrollbar-thumb:hover {
				background: var(--swagger-text-secondary, #999);
			}

		/* Print styles */
		@media print {
			.swagger-advanced-search,
			.swagger-theme-toggle,
			.swagger-execute-btn,
			.swagger-cache-controls {
				display: none !important;
			}

			.swagger-ui {
				box-shadow: none !important;
			}

			.opblock {
				break-inside: avoid;
			}
		}

		/* Accessibility improvements */
		.visually-hidden {
			position: absolute !important;
			width: 1px !important;
			height: 1px !important;
			padding: 0 !important;
			margin: -1px !important;
			overflow: hidden !important;
			clip: rect(0, 0, 0, 0) !important;
			white-space: nowrap !important;
			border: 0 !important;
		}

		/* Focus indicators */
		button:focus,
		input:focus,
		select:focus,
		textarea:focus {
			outline: 2px solid var(--swagger-accent-color, #007bff);
			outline-offset: 2px;
		}

		/* High contrast mode support */
		@media (prefers-contrast: high) {
			:root {
				--swagger-border-color: #000;
				--swagger-text-primary: #000;
				--swagger-bg-primary: #fff;
			}

			[data-theme="dark"] {
				--swagger-border-color: #fff;
				--swagger-text-primary: #fff;
				--swagger-bg-primary: #000;
			}
		}

		/* Reduced motion support */
		@media (prefers-reduced-motion: reduce) {
			*,
			*::before,
			*::after {
				animation-duration: 0.01ms !important;
				animation-iteration-count: 1 !important;
				transition-duration: 0.01ms !important;
			}

			.swagger-preloader {
				animation: none;
			}

			.swagger-loader {
				animation: none;
				border-top-color: var(--swagger-accent-color, #007bff);
			}
		}
	</style>
</head>
<body>
	<!-- Preloader -->
	<div class="swagger-preloader" id="swagger-preloader">
		<div class="swagger-loader"></div>
	</div>

	<!-- Error Boundary -->
	<div class="swagger-error-boundary" id="swagger-error-boundary" style="display: none;">
		<h3>⚠️ Something went wrong</h3>
		<p>The Swagger UI failed to load properly. Please try refreshing the page.</p>
		<details>
			<summary>Technical Details</summary>
			<pre id="error-details"></pre>
		</details>
		<button onclick="location.reload()">🔄 Reload Page</button>
	</div>

	<!-- Main Swagger UI Container -->
	<div id="swagger-ui"></div>

	<!-- Configuration Script -->
	<script>
        // Global configuration object that can be customized
        window.swaggerAdvancedConfig = {
            // Configuration will be injected by server
            %(SwaggerAdvancedConfig)
        };

        // Error handling
        window.addEventListener('error', function(e) {
            console.error('Global error:', e.error);
            showErrorBoundary(e.error);
        });

        window.addEventListener('unhandledrejection', function(e) {
            console.error('Unhandled promise rejection:', e.reason);
            showErrorBoundary(e.reason);
        });

        function showErrorBoundary(error) {
            const errorBoundary = document.getElementById('swagger-error-boundary');
            const errorDetails = document.getElementById('error-details');
            const preloader = document.getElementById('swagger-preloader');

            if (errorBoundary && errorDetails) {
                errorDetails.textContent = error.stack || error.toString();
                errorBoundary.style.display = 'block';
                if (preloader) {
                    preloader.classList.add('hidden');
                }
            }
        }

        function hidePreloader() {
            const preloader = document.getElementById('swagger-preloader');
            if (preloader) {
                setTimeout(() => {
                    preloader.classList.add('hidden');
                    setTimeout(() => {
                        preloader.remove();
                    }, 300);
                }, 500);
            }
        }

        // Performance monitoring
        const startTime = performance.now();

        // Initialize Swagger UI with enhanced configuration
        window.onload = function() {
            try {
                // HangFire-compatible initialization or standard Swagger UI
                const ui = SwaggerUIBundle({
                    url: '%(SpecUrl)',
                    dom_id: '#swagger-ui',
                    deepLinking: true,
                    presets: [
                        SwaggerUIBundle.presets.apis,
                        SwaggerUIStandalonePreset
                    ],
                    plugins: [
                        SwaggerUIBundle.plugins.DownloadUrl
                    ],
                    layout: "StandaloneLayout",
                    docExpansion: "none",
                    defaultModelsExpandDepth: 1,
                    defaultModelExpandDepth: 1,
                    showExtensions: true,
                    showCommonExtensions: true,
                    displayOperationId: false,
                    displayRequestDuration: true,
                    tryItOutEnabled: true,
                    requestSnippetsEnabled: true,
                    supportedSubmitMethods: ['get', 'post', 'put', 'delete', 'patch', 'head', 'options'],
                    validatorUrl: null,
                    // Enhanced features
                    persistAuthorization: true,
                    withCredentials: true,
                    onComplete: function() {
                        const loadTime = performance.now() - startTime;
                        console.log(`✅ Swagger UI loaded in ${loadTime.toFixed(0)}ms`);

                        // Initialize advanced features
                        setTimeout(() => {
                            if (window.MythSwaggerUI) {
                                window.mythSwagger = new window.MythSwaggerUI(window.swaggerAdvancedConfig);
                                window.mythSwagger.initialize().then(() => {
                                    hidePreloader();
                                }).catch((error) => {
                                    console.error('Failed to initialize advanced features:', error);
                                    hidePreloader();
                                });
                            } else {
                                hidePreloader();
                            }
                        }, 100);
                    },
                    onFailure: function(error) {
                        console.error('Swagger UI failed to load:', error);
                        showErrorBoundary(error);
                    }
                });

                window.ui = ui;

            } catch (error) {
                console.error('Failed to initialize Swagger UI:', error);
                showErrorBoundary(error);
            }
        };

        // Accessibility enhancements
        document.addEventListener('keydown', function(e) {
            // Skip to main content with Alt+M
            if (e.altKey && e.key === 'm') {
                const main = document.getElementById('swagger-ui');
                if (main) {
                    main.focus();
                    main.scrollIntoView();
                }
            }
        });

        // Service Worker registration for offline support (optional)
        if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
            navigator.serviceWorker.register('/swagger-sw.js').catch(function(error) {
                console.log('Service Worker registration failed:', error);
            });
        }
	</script>

	<!-- Core Swagger UI Scripts -->
	<script src="./swagger-ui-bundle.js" charset="UTF-8"></script>
	<script src="./swagger-ui-standalone-preset.js" charset="UTF-8"></script>

	<!-- Enhanced Swagger UI Scripts -->
	<script src="/swagger-ui/swagger-advanced.js" charset="UTF-8"></script>

	<!-- SEO and Social Meta Tags -->
	<meta name="description" content="%(DocumentDescription)">
	<meta name="robots" content="noindex, nofollow">

	<!-- Analytics Integration Point -->
	<!-- Analytics scripts can be injected here if configured -->
	%(AnalyticsScript)

	<!-- Custom Scripts Integration Point -->
	%(CustomScripts)
</body>
</html>
